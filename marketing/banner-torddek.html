<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PolyQuest Banner - TORDDEK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .banner {
    width: 400px;
    height: 120px;
    background: #000000;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
  }

  .banner-content {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    width: 100%;
  }

  .logo-img {
    width: 88px;
    height: 88px;
    object-fit: contain;
    flex-shrink: 0;
  }

  .info {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .brand-name {
    font-size: 24px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 1px;
  }

  .coupon-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .coupon-label {
    font-size: 9px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .coupon-code {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    font-family: monospace;
    letter-spacing: 2px;
    background: #1a1a1a;
    padding: 2px 10px;
    border-radius: 4px;
    border: 1px solid #333;
  }

  .qr-img {
    width: 88px;
    height: 88px;
    border-radius: 6px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-content">
    <img src="logo.png" alt="PolyQuest" class="logo-img">
    <div class="info">
      <div class="brand-name">POLYQUEST</div>
      <span class="coupon-code">TORDDEK</span>
    </div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://www.polyquest.store&bgcolor=000000&color=ffffff&format=png" alt="QR Code - polyquest.store" class="qr-img">
  </div>
</div>

</body>
</html>
