<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PolyQuest Banner - Twitch Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }

  .banner {
    width: 340px;
    height: 400px;
    background: #0a0e18;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Background effects */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(155, 48, 255, 0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(0, 229, 255, 0.1) 0%, transparent 60%);
    z-index: 0;
  }
  .banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 229, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 229, 255, 0.03) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 0;
  }

  .banner-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 36px;
    gap: 14px;
  }

  .logo-img {
    width: 80px;
    height: auto;
    filter: drop-shadow(0 0 20px rgba(155, 48, 255, 0.4));
  }

  .brand-name {
    font-size: 22px;
    font-weight: 900;
    background: linear-gradient(135deg, #00e5ff, #9b30ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }

  .discount-badge {
    background: linear-gradient(135deg, #9b30ff, #6c5ce7);
    color: #fff;
    font-size: 32px;
    font-weight: 900;
    padding: 8px 28px;
    border-radius: 12px;
    letter-spacing: -1px;
    box-shadow: 0 0 30px rgba(155, 48, 255, 0.4), 0 4px 15px rgba(0,0,0,0.3);
    margin: 4px 0;
  }

  .discount-label {
    font-size: 13px;
    font-weight: 700;
    color: #00e5ff;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .coupon-box {
    background: #111c30;
    border: 1px solid rgba(0, 229, 255, 0.2);
    border-radius: 8px;
    padding: 8px 20px;
    margin-top: 4px;
  }

  .coupon-label {
    font-size: 10px;
    color: #5a7a9a;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .coupon-code {
    font-size: 20px;
    font-weight: 900;
    color: #00e5ff;
    font-family: monospace;
    letter-spacing: 3px;
  }

  .tagline {
    font-size: 11px;
    color: #5a7a9a;
    max-width: 260px;
    line-height: 1.4;
  }

  /* Glow border */
  .banner-border {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    border: 1px solid rgba(155, 48, 255, 0.3);
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>

<div class="banner">
  <div class="banner-content">
    <img src="logo.png" alt="PolyQuest" class="logo-img">
    <div class="brand-name">POLYQUEST</div>
    <div class="discount-label">Desconto exclusivo</div>
    <div class="discount-badge">30% OFF</div>
    <div class="coupon-box">
      <div class="coupon-label">Use o cupom</div>
      <div class="coupon-code">SEUCUPOM</div>
    </div>
    <div class="tagline">Traduza qualquer jogo em tempo real</div>
  </div>
  <div class="banner-border"></div>
</div>

</body>
</html>
